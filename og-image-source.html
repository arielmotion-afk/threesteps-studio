<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG image source</title>
<!-- Source for images/og-image.jpg (link previews: WhatsApp, LinkedIn, Slack): the homepage header scene at 1200×630.

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Mona+Sans:wdth,wght@125,900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #E4E9F1; }
  .bub { position: relative; width: 1200px; height: 630px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bub-name { display: none; }
</style>
</head>
<body>
  <section class="bub" id="og"><canvas id="ogc"></canvas><h1 class="bub-name">ARIEL PAZ</h1></section>
  <script src="js/bubbles.js"></script>
  <script>
    Bubbles.scene(document.getElementById('og'), document.getElementById('ogc'), {
      a: ['ARIEL', 'PAZ'], b: ['MOTION', 'DESIGN'], center: true, pills: ['MOTION', 'PRODUCT', 'MARKETING'],
      homes: [{ hx: .66, hy: .16, r: .22 }, { hx: .28, hy: .72, r: .12 }, { hx: .84, hy: .66, r: .06 }],
      phone: [[.62, .26], [.32, .66], [.82, .58]],
    });
  </script>
</body>
