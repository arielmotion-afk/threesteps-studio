<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #FDF0F0;
      font-family: 'HelveticaNeue-CondensedBold', 'Helvetica Neue Condensed Bold', 'Arial Narrow', sans-serif;
    }
    .wrap {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 90px;
      gap: 20px;
    }
    .title {
      font-family: 'HelveticaNeue-CondensedBold', 'Helvetica Neue Condensed Bold', 'Arial Narrow', sans-serif;
      font-weight: 700;
      font-stretch: condensed;
      font-size: 120px;
      line-height: 0.95;
      color: #1a1a1a;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .tagline {
      font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 28px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      margin-top: 8px;
    }
    .services {
      font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 22px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #bbb;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Three Steps Studio</div>
    <div class="tagline">Always Moving.</div>
    <div class="services">Motion Design &nbsp;·&nbsp; UGC &nbsp;·&nbsp; AI Content</div>
  </div>
</body>
</html>
