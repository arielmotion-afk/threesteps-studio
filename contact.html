<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Three Steps Studio</title>
  <meta name="description" content="Get in touch with Ariel Paz — motion designer and creative strategist.">
  <meta property="og:title" content="Contact — Three Steps Studio">
  <meta property="og:description" content="Motion designer and creative strategist available for projects.">
  <meta property="og:image" content="https://threesteps.studio/images/og-image.jpg?v=4">
  <meta property="og:url" content="https://threesteps.studio/contact.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://threesteps.studio/images/og-image.jpg?v=4">
  <link rel="icon" type="image/png" href="/images/favicon-dark.png?v=3" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/images/favicon-light.png?v=3" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@125,500;125,700;125,800;125,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="stylesheet" href="css/bubbles.css?v=1">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Ariel Paz<span class="nav-logo-suffix">&nbsp;&mdash;&nbsp;Motion Design &amp; Video Editing</span></a>
    <ul class="nav-links">
      <li><a href="index.html#work">Work</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="files/Ariel-Paz-CV.pdf" class="cv" target="_blank" rel="noopener">Resume<svg class="arw" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 9 3M4.5 3H9v4.5"/></svg></a></li>
    </ul>
  </nav>

  <main>

    <section class="hero">
      <div class="hero-title-row">
        <h1 class="hero-title">Let's Work Together</h1>
      </div>
      <p class="hero-tagline">Available for projects &amp; collaborations</p>
    </section>

    <section class="contact-page">
      <div class="contact-page-inner contact-page-inner--solo">

        <div class="contact-methods">
          <h2 class="contact-methods-label">Get in Touch</h2>
          <div class="contact-cards">

            <a href="mailto:arielmotion@gmail.com?subject=Let's%20work%20together" class="contact-card">
              <span class="contact-card-title">Email</span>
              <span class="contact-card-value">arielmotion@gmail.com</span>
            </a>

            <a href="https://wa.me/972545872899" target="_blank" rel="noopener" class="contact-card">
              <span class="contact-card-title">WhatsApp</span>
              <span class="contact-card-value">+972-545-872-899</span>
            </a>

            <a href="https://www.linkedin.com/in/ariel-paz-motion/" target="_blank" rel="noopener" class="contact-card">
              <span class="contact-card-title">LinkedIn</span>
              <span class="contact-card-value">ariel-paz-motion</span>
            </a>

          </div>

          <form class="contact-form" onsubmit="handleContactForm(event)">
            <div class="contact-form-row">
              <input type="text" name="name" placeholder="Your name" required class="contact-input">
              <input type="email" name="email" placeholder="Your email" required class="contact-input">
            </div>
            <textarea name="message" placeholder="Tell me about your project…" required rows="5" class="contact-input contact-textarea"></textarea>
            <button type="submit" class="contact-submit">Send Message</button>
          </form>

        </div>

      </div>
    </section>

  </main>

  <footer class="bub bub--foot" id="bubFoot" aria-label="Contact">
  <canvas id="bubFootCanvas" aria-hidden="true"></canvas>
  <h2 class="bub-name">LET'S TALK</h2>
  <span class="bub-legal">© 2026 Ariel Paz · Three Steps Studio</span>
</footer>

  <script>
    function handleContactForm(e) {
      e.preventDefault();
      var name = e.target.name.value;
      var email = e.target.email.value;
      var message = e.target.message.value;
      var subject = encodeURIComponent('Project inquiry from ' + name);
      var body = encodeURIComponent('Hi Ariel,\n\n' + message + '\n\nBest,\n' + name + '\n' + email);
      window.location.href = 'mailto:arielmotion@gmail.com?subject=' + subject + '&body=' + body;
    }
  </script>

  <script src="js/main.js"></script>
<script src="js/bubbles.js?v=5"></script>
<script>
  Bubbles.scene(document.getElementById('bubFoot'), document.getElementById('bubFootCanvas'), {
    a: ["LET'S", 'TALK'], b: [], top: .26, topPhone: .24, seed: 31, scale: .45,
    pills: [{ label: 'ARIELMOTION@GMAIL.COM', href: 'mailto:arielmotion@gmail.com', aria: 'Email arielmotion@gmail.com' }, { label: 'LINKEDIN', href: 'https://www.linkedin.com/in/ariel-paz-motion/', aria: 'LinkedIn' }, { label: 'RESUME', href: 'files/Ariel-Paz-CV.pdf', aria: 'Resume (PDF)' }],
    homes: [{ hx: .8, hy: .46, r: .17 }], phone: [[.82, .3]],
    glow: [.5, 1.04, .7, 1.05], glow2: [.72, 1.02, 1.1, 1.6],
  });
</script>
</body>
</html>
